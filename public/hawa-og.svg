<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
      .title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 900; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
    </style>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#1E5560" />
      <stop offset="35%" stop-color="#5B8EF2" />
      <stop offset="70%" stop-color="#FF8A3D" />
      <stop offset="100%" stop-color="#F5C6D2" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="100%" stop-color="#E6691A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3B0F20" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Linen -->
  <rect width="1200" height="630" fill="#F3EDE2" />

  <!-- Air swirl flowing waves in Baby Pink & Cool Blue -->
  <path d="M-100 200 C300 80, 500 450, 900 220 C1100 120, 1250 300, 1350 250" fill="none" stroke="#F5C6D2" stroke-width="48" stroke-linecap="round" opacity="0.6" />
  <path d="M-50 420 C250 550, 600 280, 950 480 C1150 580, 1250 450, 1350 420" fill="none" stroke="#5B8EF2" stroke-width="36" stroke-linecap="round" opacity="0.35" />
  <path d="M100 -50 C400 250, 800 -80, 1250 150" fill="none" stroke="#E8DFCF" stroke-width="24" stroke-linecap="round" opacity="0.8" />

  <!-- Center Card Preview -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect width="1000" height="430" rx="32" fill="#F3EDE2" stroke="#E8DFCF" stroke-width="2" />
    
    <!-- Top Bar -->
    <text x="60" y="70" class="title" font-size="20" font-weight="800" fill="#1E5560" letter-spacing="2">
      CAMPUS PREDICTION MARKET
    </text>

    <!-- Giant "hawa" Wordmark -->
    <text x="60" y="210" class="title" font-size="140" fill="url(#metalGrad)" letter-spacing="-4">
      hawa
    </text>

    <!-- Tagline & Secondary -->
    <text x="60" y="275" class="title" font-size="44" fill="#3B0F20">
      Kya hawa hai?
    </text>
    <text x="60" y="325" class="sans" font-size="24" font-weight="500" fill="#3B0F20" opacity="0.75">
      Call it before it happens.
    </text>

    <!-- Brand Promise Badge -->
    <rect x="60" y="360" width="460" height="40" rx="20" fill="#E8DFCF" />
    <text x="80" y="386" class="sans" font-size="15" font-weight="700" fill="#1E5560">
      Play coins only. No real money. Just bragging rights.
    </text>

    <!-- 3D Coin Graphic Right -->
    <g transform="translate(800, 215)">
      <circle r="120" fill="url(#coinGrad)" filter="url(#shadow)" />
      <circle r="105" fill="none" stroke="#FFAE70" stroke-width="4" stroke-dasharray="8 8" />
      <circle r="95" fill="#E6691A" />
      <text x="0" y="44" text-anchor="middle" class="title" font-size="130" fill="#FFE0CC">H</text>
    </g>
  </g>
</svg>
