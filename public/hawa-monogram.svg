      <stop offset="0%" stop-color="#1E5560" />
      <stop offset="60%" stop-color="#3B0F20" />
      <stop offset="100%" stop-color="#FF8A3D" />
    </linearGradient>
  </defs>
  <!-- Rounded squircle app icon background -->
  <rect width="120" height="120" rx="32" fill="#F3EDE2" />
